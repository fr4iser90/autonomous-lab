name: Open agent PR

# Keep a PR open from each agent/* tip into main so CI + automerge can run.
on:
  push:
    branches: ['agent/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          owner="${GITHUB_REPOSITORY_OWNER}"

          count_open() {
            # Try owner:branch then bare branch — gh head filter is picky.
            local n
            n="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "${owner}:${branch}" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            if [[ "$n" != "0" ]]; then echo "$n"; return; fi
            n="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "${branch}" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            echo "$n"
          }

          open_count="$(count_open)"
          if [[ "$open_count" != "0" ]]; then
            echo "Open PR already exists for $branch"
            exit 0
          fi

          set +e
          create_out="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "Live: ${branch}" \
            --body "$(cat <<EOF
          Automerge candidate from \`${branch}\`.

          - CI \`gate\` must pass on the agent tip
          - Automerge lands on \`main\` (squash, or conflict-resolved merge → main)
          - Do not push \`main\`/\`baseline\` from the agent
          EOF
          )" 2>&1)"
          create_ec=$?
          set -e
          echo "$create_out"

          if [[ "$create_ec" -eq 0 ]]; then
            echo "Created PR"
            exit 0
          fi

          # gh often prints "already exists" + URL even when --head list filters miss
          if echo "$create_out" | grep -qiE 'already exists|pull request.*exists'; then
            echo "PR already exists (from gh create message) — OK"
            exit 0
          fi

          # Race: PR opened between list and create
          open_count="$(count_open)"
          if [[ "$open_count" != "0" ]]; then
            echo "PR exists after create race — OK"
            exit 0
          fi

          echo "::error::gh pr create failed and no open PR found"
          exit 1
