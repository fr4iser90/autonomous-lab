name: Pages

# Deploys GitHub Pages from main.
# Merges performed with GITHUB_TOKEN do not re-trigger `on.push` workflows, so
# we also chain via workflow_run after "Automerge agent PRs" succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Automerge agent PRs]
    types: [completed]

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.out.outputs.should_deploy }}
    steps:
      - name: Decide
        id: out
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName
            if (event === 'push' || event === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true')
              return
            }
            if (event !== 'workflow_run') {
              core.setOutput('should_deploy', 'false')
              return
            }
            const wr = context.payload.workflow_run
            if (wr.conclusion !== 'success') {
              core.info(`Automerge conclusion=${wr.conclusion} — skip Pages`)
              core.setOutput('should_deploy', 'false')
              return
            }
            // Automerge jobs: squash | merge-to-main | sync-agent.
            // sync-agent ONLY runs when something actually landed on main
            // (needs.squash.merged || needs.merge-to-main.landed). Deploy then.
            // Old bug: looked for job name "merge" (never existed) → always skip.
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: wr.id,
              },
            )
            const sync = jobs.find((j) => j.name === 'sync-agent')
            if (sync && sync.conclusion === 'success') {
              core.info('Automerge sync-agent succeeded — deploy Pages from main')
              core.setOutput('should_deploy', 'true')
              return
            }
            core.info(
              `Automerge ran but sync-agent=${sync?.conclusion ?? 'absent/skipped'} — skip Pages (no land)`,
            )
            core.setOutput('should_deploy', 'false')

  build:
    needs: decide
    if: needs.decide.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
