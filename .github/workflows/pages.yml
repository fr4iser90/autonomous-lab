name: Pages

# Deploys GitHub Pages from main.
# Merges performed with GITHUB_TOKEN do not re-trigger `on.push` workflows, so
# we also chain via workflow_run after "Automerge agent PRs" succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Automerge agent PRs]
    types: [completed]

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  # Do not cancel: a noop workflow_run (no land) used to cancel an in-flight
  # push/workflow_dispatch deploy and leave Pages stale.
  group: pages
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.out.outputs.should_deploy }}
    steps:
      - name: Decide
        id: out
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName
            if (event === 'push' || event === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true')
              return
            }
            if (event !== 'workflow_run') {
              core.setOutput('should_deploy', 'false')
              return
            }
            const wr = context.payload.workflow_run
            // Only react to Automerge agent PRs completions.
            // CI completions should not trigger Pages deploy.
            if (wr.workflow.name !== 'Automerge agent PRs') {
              core.info(`workflow=${wr.workflow.name} — skip Pages (not Automerge)`)
              core.setOutput('should_deploy', 'false')
              return
            }
            if (wr.conclusion !== 'success') {
              core.info(`Automerge conclusion=${wr.conclusion} — skip Pages`)
              core.setOutput('should_deploy', 'false')
              return
            }
            // Automerge completed successfully → main was updated (squash or merge-to-main).
            // sync-agent always runs on success now (may be no-op if nothing landed),
            // so its absence does not mean nothing landed. Deploy.
            // B-14 fix: previously required sync-agent.conclusion === 'success',
            // but sync-agent was skipped on squash-merge → Pages never deployed.
            core.info('Automerge succeeded — deploy Pages from main')
            core.setOutput('should_deploy', 'true')

  build:
    needs: decide
    if: needs.decide.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
